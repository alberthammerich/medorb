version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/examples/vite"
    schedule:
      interval: "weekly"
    groups:
      vite-toolchain:
        applies-to: "version-updates"
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "vite-plugin-dts"
          - "typescript"
          - "@typescript/typescript6"
